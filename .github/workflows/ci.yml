name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - run: go test ./...

      #! - name: Run Docker Headscale E2E
      #!   run: ./e2e/run-compose.sh

      - run: go build -o domain-gateway ./cmd/domain-gateway

      - uses: actions/upload-artifact@v4
        with:
          name: domain-gateway
          path: domain-gateway
          if-no-files-found: error
